modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Kitoglav, Accidey"
logoFile="amethysttoolsmod-logo.png"
description='''
Amethyst Tools Mod
紫水晶工具模组

A NeoForge port of Kitoglav's Amethyst Tools Mod (Minecraft 1.21.1), ported by Accidey. Adds amethyst-upgraded tools, armor, arrows and a trident crafted from iron, diamond and netherite gear.
由 Accidey 移植自 Kitoglav 的 Amethyst Tools Mod（Minecraft 1.21.1 / NeoForge）。将铁质、钻石与下界合金装备升级为紫水晶强化版：工具、盔甲、箭矢与三叉戟。
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
